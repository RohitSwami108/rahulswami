<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="100%" height="100%" style="background:#090d16; font-family:'JetBrains Mono', 'Space Mono', Consolas, monospace;">
  <defs>
    <pattern id="cadgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111c30" stroke-width="0.8"/>
    </pattern>
    <pattern id="diagHatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#38bdf8" stroke-width="0.8" opacity="0.3"/>
    </pattern>
    <pattern id="plywoodHatch" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 0 4 L 16 4 M 0 12 L 16 12" stroke="#f59e0b" stroke-width="0.6" opacity="0.35"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0,2 8,5 0,8" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#070b12"/>
  <rect width="100%" height="100%" fill="url(#cadgrid)"/>

  <!-- AutoCAD Sheet Borders -->
  <rect x="30" y="30" width="1340" height="840" fill="none" stroke="#0284c7" stroke-width="2"/>
  <rect x="38" y="38" width="1324" height="824" fill="none" stroke="#0369a1" stroke-width="0.8"/>

  <!-- Header -->
  <g transform="translate(80, 80)">
    <text x="0" y="0" fill="#38bdf8" font-size="20" font-weight="bold" letter-spacing="1">INTERNAL CARCASS &amp; ELEVATION: MODULAR WALK-IN WARDROBE</text>
    <text x="0" y="24" fill="#94a3b8" font-size="12">18mm MARINE GRADE BWR PLYWOOD W/ 1mm MATTE ACRYLIC LAMINATE &amp; SMOKED FLUTED GLASS</text>
    <line x1="0" y1="34" x2="880" y2="34" stroke="#0284c7" stroke-width="1.5"/>
  </g>

  <!-- Wardrobe Main Structure Section -->
  <!-- Dimensions: Width 3200mm, Height 2700mm (Plinth 100mm, Loft 600mm, Main Carcass 2000mm) -->
  <g transform="translate(140, 180)">
    <!-- Outer Carcass -->
    <rect x="0" y="0" width="800" height="520" fill="none" stroke="#e2e8f0" stroke-width="2.2"/>

    <!-- Loft Section (Top 120px) -->
    <line x1="0" y1="120" x2="800" y2="120" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="400" y="70" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">OVERHEAD STORAGE LOFT (HYDRAULIC UP-LIFT SHUTTERS)</text>

    <!-- Loft Vertical Dividers -->
    <line x1="200" y1="0" x2="200" y2="120" stroke="#38bdf8" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="120" stroke="#38bdf8" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="120" stroke="#38bdf8" stroke-width="1"/>

    <!-- Lower Plinth (Bottom 25px) -->
    <line x1="0" y1="495" x2="800" y2="495" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="400" y="512" fill="#f59e0b" font-size="10" text-anchor="middle">100mm RECESSED WATERPROOF PLINTH SKIRTING</text>

    <!-- 4 Vertical Wardrobe Modules (Width 200px each) -->
    <!-- Module 1: Long Hanging Coat & Dress Unit -->
    <g transform="translate(0, 120)">
      <line x1="200" y1="0" x2="200" y2="375" stroke="#e2e8f0" stroke-width="1.8"/>
      <!-- Top Shelf -->
      <line x1="0" y1="50" x2="200" y2="50" stroke="#38bdf8" stroke-width="1"/>
      <!-- Hanging Rod w/ Integrated LED -->
      <line x1="15" y1="75" x2="185" y2="75" stroke="#fbbf24" stroke-width="2.5"/>
      <circle cx="100" cy="75" r="4" fill="#fbbf24"/>
      <text x="100" y="95" fill="#fbbf24" font-size="9" text-anchor="middle">PIR SENSOR LED ROD</text>
      <text x="100" y="240" fill="#94a3b8" font-size="11" text-anchor="middle">LONG COAT / DRESS</text>
      <!-- Bottom Shoe / Luggage Tray -->
      <line x1="0" y1="310" x2="200" y2="310" stroke="#38bdf8" stroke-width="1"/>
      <text x="100" y="350" fill="#64748b" font-size="10" text-anchor="middle">CABIN LUGGAGE</text>
    </g>

    <!-- Module 2: Double Hanging Unit (Shirts & Blazers) -->
    <g transform="translate(200, 120)">
      <line x1="200" y1="0" x2="200" y2="375" stroke="#e2e8f0" stroke-width="1.8"/>
      <!-- Upper Hanging -->
      <line x1="15" y1="50" x2="185" y2="50" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="100" y="70" fill="#94a3b8" font-size="10" text-anchor="middle">SHIRTS HANGING</text>
      <!-- Mid Shelf -->
      <line x1="0" y1="180" x2="200" y2="180" stroke="#38bdf8" stroke-width="1"/>
      <!-- Lower Hanging -->
      <line x1="15" y1="225" x2="185" y2="225" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="100" y="245" fill="#94a3b8" font-size="10" text-anchor="middle">TROUSER PULL-OUT</text>
      <line x1="0" y1="310" x2="200" y2="310" stroke="#38bdf8" stroke-width="1"/>
      <text x="100" y="348" fill="#64748b" font-size="10" text-anchor="middle">FOLDED KNITS</text>
    </g>

    <!-- Module 3: Accessory Drawers & Jewellery Organiser -->
    <g transform="translate(400, 120)">
      <line x1="200" y1="0" x2="200" y2="375" stroke="#e2e8f0" stroke-width="1.8"/>
      <!-- 4 Drawers -->
      <rect x="10" y="20" width="180" height="45" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="100" y="48" fill="#38bdf8" font-size="9" text-anchor="middle">JEWELLERY &amp; WATCH TRAY</text>
      <rect x="10" y="75" width="180" height="55" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="100" y="108" fill="#94a3b8" font-size="9" text-anchor="middle">ACCESSORY DRAWER</text>
      <rect x="10" y="140" width="180" height="70" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="100" y="180" fill="#94a3b8" font-size="9" text-anchor="middle">DEEP LINEN DRAWER</text>
      <rect x="10" y="220" width="180" height="80" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="100" y="265" fill="#94a3b8" font-size="9" text-anchor="middle">LOCKER COMPARTMENT</text>
      <line x1="0" y1="310" x2="200" y2="310" stroke="#38bdf8" stroke-width="1"/>
      <text x="100" y="348" fill="#64748b" font-size="10" text-anchor="middle">SLIPPER RACK</text>
    </g>

    <!-- Module 4: Open Shelving & Handbag Display -->
    <g transform="translate(600, 120)">
      <rect x="0" y="0" width="200" height="375" fill="url(#diagHatch)"/>
      <line x1="0" y1="75" x2="200" y2="75" stroke="#38bdf8" stroke-width="1"/>
      <line x1="0" y1="150" x2="200" y2="150" stroke="#38bdf8" stroke-width="1"/>
      <line x1="0" y1="225" x2="200" y2="225" stroke="#38bdf8" stroke-width="1"/>
      <line x1="0" y1="300" x2="200" y2="300" stroke="#38bdf8" stroke-width="1"/>
      <text x="100" y="45" fill="#e0f2fe" font-size="10" text-anchor="middle">SHELF 01 (BAGS)</text>
      <text x="100" y="120" fill="#e0f2fe" font-size="10" text-anchor="middle">SHELF 02 (PERFUMES)</text>
      <text x="100" y="195" fill="#e0f2fe" font-size="10" text-anchor="middle">SHELF 03 (FOLDED)</text>
      <text x="100" y="270" fill="#e0f2fe" font-size="10" text-anchor="middle">SHELF 04 (STORAGE)</text>
      <text x="100" y="345" fill="#e0f2fe" font-size="10" text-anchor="middle">SHELF 05 (FOOTWEAR)</text>
    </g>
  </g>

  <!-- Title Block Right -->
  <g transform="translate(970, 720)">
    <rect width="390" height="140" fill="#0c1729" stroke="#0284c7" stroke-width="1.5"/>
    <text x="195" y="26" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1">ETTORE INTERIOR &amp; CAMARA INTERIORS</text>
    <line x1="0" y1="40" x2="390" y2="40" stroke="#0369a1" stroke-width="1"/>
    <text x="15" y="65" fill="#94a3b8" font-size="10">DRAWING: WARDROBE INTERNAL CARCASS</text>
    <text x="15" y="95" fill="#94a3b8" font-size="10">HARDWARE: HETTICH SOFT-CLOSE / INNOTECH</text>
    <text x="15" y="125" fill="#38bdf8" font-size="11" font-weight="bold">DESIGNER: RAHUL SWAMI | AUTOCAD 2025</text>
  </g>
</svg>

