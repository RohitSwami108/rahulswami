<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="100%" height="100%" style="background:#0a101d; font-family:'JetBrains Mono', 'Space Mono', Consolas, monospace;">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#14213d" stroke-width="0.8"/>
    </pattern>
    <pattern id="subgrid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#0e172a" stroke-width="0.4"/>
    </pattern>
    <!-- Hatch Patterns for Materials -->
    <pattern id="woodHatch" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#00b4d8" stroke-width="0.7" opacity="0.4"/>
    </pattern>
    <pattern id="acousticHatch" width="6" height="12" patternUnits="userSpaceOnUse">
      <line x1="3" y1="0" x2="3" y2="12" stroke="#48cae4" stroke-width="1" opacity="0.6"/>
    </pattern>
    <pattern id="glassHatch" width="20" height="20" patternUnits="userSpaceOnUse">
      <line x1="0" y1="20" x2="20" y2="0" stroke="#00f5d4" stroke-width="0.6" opacity="0.5"/>
    </pattern>
    <!-- Marker for Dimensions -->
    <marker id="tick" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <line x1="2" y1="8" x2="8" y2="2" stroke="#00b4d8" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Background Grids -->
  <rect width="100%" height="100%" fill="#070c14"/>
  <rect width="100%" height="100%" fill="url(#subgrid)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- AutoCAD Sheet Border & Title Block -->
  <rect x="30" y="30" width="1340" height="840" fill="none" stroke="#0077b6" stroke-width="2"/>
  <rect x="38" y="38" width="1324" height="824" fill="none" stroke="#0096c7" stroke-width="0.8"/>

  <!-- Title Block (Bottom Right) -->
  <g transform="translate(940, 720)">
    <rect width="420" height="140" fill="#0c1729" stroke="#00b4d8" stroke-width="1.5"/>
    <line x1="0" y1="35" x2="420" y2="35" stroke="#0077b6" stroke-width="1"/>
    <line x1="0" y1="70" x2="420" y2="70" stroke="#0077b6" stroke-width="1"/>
    <line x1="0" y1="105" x2="420" y2="105" stroke="#0077b6" stroke-width="1"/>
    <line x1="210" y1="35" x2="210" y2="140" stroke="#0077b6" stroke-width="1"/>
    
    <text x="210" y="24" fill="#90e0ef" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="2">CAMARA INTERIORS • RESIDENTIAL STUDIO</text>
    <text x="15" y="55" fill="#48cae4" font-size="10">PROJECT: LUXURY MASTER BEDROOM</text>
    <text x="225" y="55" fill="#48cae4" font-size="10">DWG NO: AR-SEC-MB-04</text>
    <text x="15" y="90" fill="#48cae4" font-size="10">TITLE: WALL ELEVATION &amp; BED DETAIL</text>
    <text x="225" y="90" fill="#48cae4" font-size="10">SCALE: 1:20 @ A3</text>
    <text x="15" y="125" fill="#00f5d4" font-size="11" font-weight="bold">DESIGNER: RAHUL SWAMI</text>
    <text x="225" y="125" fill="#90e0ef" font-size="10">SOFTWARE: AUTOCAD 2025</text>
  </g>

  <!-- Drawing Title (Top Left) -->
  <g transform="translate(80, 80)">
    <text x="0" y="0" fill="#00f5d4" font-size="20" font-weight="bold" letter-spacing="1">ELEVATION A-A' : BED HEADBOARD &amp; FLUTED FEATURE WALL</text>
    <text x="0" y="24" fill="#90e0ef" font-size="12">ALL DIMENSIONS ARE IN MILLIMETERS (U.N.O.) • CEILING CLEAR HEIGHT: 3050mm (10'-0")</text>
    <line x1="0" y1="34" x2="780" y2="34" stroke="#00b4d8" stroke-width="1.5"/>
  </g>

  <!-- Architectural Coordinates / Datum lines -->
  <line x1="120" y1="680" x2="900" y2="680" stroke="#e0e1dd" stroke-width="2.5"/> <!-- Finished Floor Level (FFL) -->
  <text x="130" y="700" fill="#e0e1dd" font-size="11" font-weight="bold">± 0.00 F.F.L. (FINISHED FLOOR LEVEL)</text>
  
  <line x1="120" y1="200" x2="900" y2="200" stroke="#ffb703" stroke-width="1.5" stroke-dasharray="8,4"/> <!-- False Ceiling Level -->
  <text x="130" y="190" fill="#ffb703" font-size="11">+ 3050 FALSE CEILING BOTTOM LEVEL</text>

  <!-- Main Wall Boundary -->
  <rect x="180" y="200" width="680" height="480" fill="none" stroke="#caf0f8" stroke-width="2"/>

  <!-- Fluted Acoustic Wall Paneling (Background) -->
  <rect x="220" y="200" width="600" height="340" fill="url(#acousticHatch)" stroke="#00b4d8" stroke-width="1.2"/>
  <rect x="220" y="200" width="600" height="340" fill="none" stroke="#90e0ef" stroke-width="1.5"/>

  <!-- Backlit LED Cove Recess -->
  <rect x="240" y="220" width="560" height="300" fill="none" stroke="#ffd166" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="520" y="240" fill="#ffd166" font-size="10" text-anchor="middle">CONCEALED 3000K WARM LED COVE STRIP</text>

  <!-- Smoked Charcoal Veneer Accents -->
  <rect x="280" y="260" width="480" height="260" fill="url(#woodHatch)" stroke="#0096c7" stroke-width="1.5"/>

  <!-- King Size Bed Frame & Upholstered Headboard -->
  <g transform="translate(320, 360)">
    <!-- Headboard -->
    <rect x="0" y="0" width="400" height="180" rx="8" fill="#132a4a" stroke="#00f5d4" stroke-width="1.8"/>
    <!-- Headboard Tufting / Fluting Lines -->
    <line x1="80" y1="0" x2="80" y2="180" stroke="#00b4d8" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="160" y1="0" x2="160" y2="180" stroke="#00b4d8" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="240" y1="0" x2="240" y2="180" stroke="#00b4d8" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="320" y1="0" x2="320" y2="180" stroke="#00b4d8" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="200" y="90" fill="#caf0f8" font-size="11" font-weight="bold" text-anchor="middle">CUSHIONED VELVET HEADBOARD (H: 900mm)</text>

    <!-- Mattress Profile -->
    <rect x="-20" y="160" width="440" height="100" rx="6" fill="#1b3b6f" stroke="#caf0f8" stroke-width="1.5"/>
    <text x="200" y="215" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">KING MATTRESS (1800 x 2000mm)</text>

    <!-- Bed Base / Plinth with Undermount LED Glow -->
    <rect x="10" y="260" width="380" height="60" fill="#0d1b2a" stroke="#00b4d8" stroke-width="1.5"/>
    <line x1="20" y1="318" x2="380" y2="318" stroke="#ffd166" stroke-width="2"/>
    <text x="200" y="295" fill="#ffd166" font-size="9" text-anchor="middle">FLOATING PLINTH W/ 45° RECESS &amp; NIGHT LIGHT</text>
  </g>

  <!-- Left Floating Bedside Nightstand & Pendant Light -->
  <g transform="translate(190, 480)">
    <rect x="0" y="0" width="110" height="65" rx="4" fill="#172554" stroke="#00f5d4" stroke-width="1.4"/>
    <line x1="10" y1="32" x2="100" y2="32" stroke="#00b4d8" stroke-width="1"/>
    <!-- Drawer Pull Knob -->
    <circle cx="55" cy="16" r="3" fill="#ffb703"/>
    <circle cx="55" cy="48" r="3" fill="#ffb703"/>
    <text x="55" y="80" fill="#90e0ef" font-size="9" text-anchor="middle">NIGHTSTAND 01</text>
    
    <!-- Pendant Cord from Ceiling -->
    <line x1="55" y1="-280" x2="55" y2="-60" stroke="#ffb703" stroke-width="1.2"/>
    <circle cx="55" cy="-55" r="12" fill="#ffb703" opacity="0.8"/>
    <polygon points="45,-45 65,-45 75, -20 35, -20" fill="none" stroke="#ffb703" stroke-width="1.2"/>
  </g>

  <!-- Right Floating Bedside Nightstand & Pendant Light -->
  <g transform="translate(740, 480)">
    <rect x="0" y="0" width="110" height="65" rx="4" fill="#172554" stroke="#00f5d4" stroke-width="1.4"/>
    <line x1="10" y1="32" x2="100" y2="32" stroke="#00b4d8" stroke-width="1"/>
    <circle cx="55" cy="16" r="3" fill="#ffb703"/>
    <circle cx="55" cy="48" r="3" fill="#ffb703"/>
    <text x="55" y="80" fill="#90e0ef" font-size="9" text-anchor="middle">NIGHTSTAND 02</text>
    
    <!-- Pendant Cord from Ceiling -->
    <line x1="55" y1="-280" x2="55" y2="-60" stroke="#ffb703" stroke-width="1.2"/>
    <circle cx="55" cy="-55" r="12" fill="#ffb703" opacity="0.8"/>
    <polygon points="45,-45 65,-45 75, -20 35, -20" fill="none" stroke="#ffb703" stroke-width="1.2"/>
  </g>

  <!-- Dimension Strings -->
  <!-- Height Dimension (Left Side) -->
  <g transform="translate(130, 0)">
    <line x1="0" y1="200" x2="0" y2="680" stroke="#00b4d8" stroke-width="1.2" marker-start="url(#tick)" marker-end="url(#tick)"/>
    <line x1="-15" y1="200" x2="15" y2="200" stroke="#00b4d8" stroke-width="0.8"/>
    <line x1="-15" y1="680" x2="15" y2="680" stroke="#00b4d8" stroke-width="0.8"/>
    <text x="-12" y="445" fill="#00f5d4" font-size="12" font-weight="bold" transform="rotate(-90, -12, 445)" text-anchor="middle">3050 mm</text>
  </g>

  <!-- Width Dimension (Bottom) -->
  <g transform="translate(0, 720)">
    <line x1="180" y1="0" x2="860" y2="0" stroke="#00b4d8" stroke-width="1.2" marker-start="url(#tick)" marker-end="url(#tick)"/>
    <line x1="180" y1="-12" x2="180" y2="12" stroke="#00b4d8" stroke-width="0.8"/>
    <line x1="860" y1="-12" x2="860" y2="12" stroke="#00b4d8" stroke-width="0.8"/>
    <text x="520" y="18" fill="#00f5d4" font-size="12" font-weight="bold" text-anchor="middle">4200 mm (BEDROOM WALL WIDTH)</text>
  </g>

  <!-- Technical Callout Leader Lines -->
  <!-- Callout 1: Fluted Acoustic Slats -->
  <g>
    <circle cx="270" cy="280" r="4" fill="#00f5d4"/>
    <polyline points="270,280 230,250 140,250" fill="none" stroke="#00f5d4" stroke-width="1.2"/>
    <text x="135" y="245" fill="#00f5d4" font-size="10" text-anchor="end">25x12mm FLUTED CHARCOAL SLATS</text>
  </g>

  <!-- Callout 2: Brass Inlay -->
  <g>
    <circle cx="680" cy="300" r="4" fill="#ffb703"/>
    <polyline points="680,300 740,270 880,270" fill="none" stroke="#ffb703" stroke-width="1.2"/>
    <text x="885" y="265" fill="#ffb703" font-size="10">8mm PVD BRUSHED BRASS T-PROFILE</text>
  </g>

  <!-- Callout 3: Upholstered Fabric -->
  <g>
    <circle cx="580" cy="410" r="4" fill="#caf0f8"/>
    <polyline points="580,410 650,440 880,440" fill="none" stroke="#caf0f8" stroke-width="1.2"/>
    <text x="885" y="435" fill="#caf0f8" font-size="10">HIGH-DENSITY FOAM W/ BOUCLÉ LINEN</text>
  </g>

  <!-- Top Right Compass / North Indicator -->
  <g transform="translate(1260, 110)">
    <circle cx="0" cy="0" r="28" fill="#0c1729" stroke="#00b4d8" stroke-width="1.5"/>
    <polygon points="0,-22 8,0 0,-4 -8,0" fill="#00f5d4"/>
    <polygon points="0,22 8,0 0,-4 -8,0" fill="#1b3b6f"/>
    <text x="0" y="-26" fill="#00f5d4" font-size="11" font-weight="bold" text-anchor="middle">N</text>
  </g>
</svg>

