<main class="min-h-screen relative overflow-x-hidden bg-[#08090c] text-[#f4f4f5]">
  <!-- Editorial Sticky Floating Navigation -->
  <app-navbar (openVault)="openVault()"></app-navbar>

  <!-- Cinematic Hero -->
  <app-hero></app-hero>

  <!-- [01] Curated Works (Editorial Large Cards) -->
  <app-project-gallery 
    (projectSelected)="openProjectModal($event)"
    (openVault)="openVault()"
  ></app-project-gallery>

  <!-- [02] Interactive 2D CAD vs 3D Corona Visualizer Studio -->
  <app-visualizer-studio></app-visualizer-studio>

  <!-- [03] Studio Practice, Experience & Background -->
  <app-experience-skills></app-experience-skills>

  <!-- [04] Studio Deliverables & Core Competencies -->
  <app-services></app-services>

  <!-- [05] Candidate Contact & Resume Submission -->
  <app-contact></app-contact>

  <!-- Minimalist Studio Footer -->
  <app-footer></app-footer>

  <!-- Case Study Lightbox Modal -->
  <app-project-modal 
    [project]="selectedProject()" 
    (close)="closeProjectModal()"
  ></app-project-modal>

  <!-- Complete 50-Render Interactive Archive Vault -->
  <app-render-vault-modal
    [isOpen]="isVaultOpen()"
    (close)="closeVault()"
  ></app-render-vault-modal>
</main>
